# Danh sách định nghĩa cronjob của Hermes
#
# Đăng ký trên máy của bạn bằng lệnh dưới đây:
#   hermes cron add ...
# Hoặc tạo thủ công trong hermes UI.
#
# Cả hai job đều dùng no_agent=true (không tốn LLM), chỉ xuất output khi lỗi/có thay đổi.

jobs:
  - name: Giám sát lắng nghe sự kiện Feishu (giữ tmux sống)
    schedule: "* * * * *"           # mỗi 60 giây
    no_agent: true
    script: ~/.hermes/scripts/base_watch_supervisor.py
    description: |
      Kiểm tra tmux session có tồn tại không; nếu không thì khởi động lark-cli event +subscribe
      pipe vào base_event_listener.py. Mỗi lần khởi động gọi một lần drive subscribe API theo kiểu idempotent.

  - name: Kanban → ghi ngược về Feishu (poll mỗi 3 phút)
    schedule: "*/3 * * * *"         # mỗi 3 phút
    no_agent: true
    script: ~/.hermes/scripts/kanban_watch.py
    description: |
      Đọc trạng thái hermes kanban cục bộ, so sánh với cache trạng thái lần trước.
      Chuyển trạng thái done/blocked/running → ghi ngược về cột tương ứng trong bảng Feishu;
      comment [QUESTION]/[ANSWER] → ghi vào Nhật ký làm rõ và Trạng thái làm rõ.

# Lưu ý:
# 1. Job đầu tiên yêu cầu tmux đã cài, lark-cli đã hoàn tất OAuth.
# 2. config.yaml phải để script tìm được (mặc định ~/.hermes/feishu-kanban-task-orchestration/config.yaml
#    hoặc ../config.yaml cùng cấp với script; cũng có thể export FKTO_CONFIG=/path/to/config.yaml).
# 3. Trước khi chạy job thứ hai hãy đảm bảo hermes kanban list --tenant <tenant của bạn> --json xuất JSON bình thường.
