# ────────────────────────────────────────────────────────────────
# feishu-kanban-task-orchestration - File cấu hình (bản macOS + team nhiều profile)
# Copy file này thành config.yaml rồi điền giá trị thật, KHÔNG commit giá trị thật lên git
#
# macOS adaptation by nthunggs:
#   - Mọi path mặc định trỏ ~ (tự mở rộng thành /Users/<you>)
#   - Thêm mục security: định danh ghi, whitelist thao tác, cổng duyệt spawn
# ────────────────────────────────────────────────────────────────

feishu:
  # base_token của bảng (trong URL: /base/<đoạn này>/)
  base_token: "REPLACE_BASE_TOKEN"
  # table ID (trong URL: ?table=<đoạn này>)
  table_id:   "REPLACE_TABLE_ID"
  # chat_id nhận thông báo (tra oc_xxx bằng lark-cli im +chat-list)
  chat_id:    "REPLACE_CHAT_ID"
  # EventKey real-time (lark-cli v1.0.19+ dùng `event consume <key>`).
  # Chạy `lark-cli event list` để xác nhận tên key app thực sự expose;
  # repo gốc gọi drive.file.bitable_record_changed_v1, app/phiên bản khác có thể khác chút.
  event_key:  "drive.file.bitable_record_changed_v1"

# Ánh xạ field ID (sau khi tạo bảng, chạy lark-cli api GET .../fields rồi điền vào)
field_ids:
  Mô tả task:       "fldXXXXXXXX"
  Quản lý:         "fldXXXXXXXX"
  Phụ trách:         "fldXXXXXXXX"
  Tiến độ:           "fldXXXXXXXX"
  Trạng thái làm rõ:       "fldXXXXXXXX"
  Trạng thái duyệt:       "fldXXXXXXXX"
  Nội dung giao:       "fldXXXXXXXX"
  Chi tiết task:       "fldXXXXXXXX"
  Tóm tắt task:   "fldXXXXXXXX"
  Thời gian bắt đầu:       "fldXXXXXXXX"
  Dự kiến hoàn thành:   "fldXXXXXXXX"
  Có trễ hạn:       "fldXXXXXXXX"
  Thời gian hoàn thành:   "fldXXXXXXXX"
  Nhật ký tiến độ:   "fldXXXXXXXX"
  Mức ưu tiên:   "fldXXXXXXXX"
  Nhật ký làm rõ:       "fldXXXXXXXX"
  Ghi chú tự kiểm:       "fldXXXXXXXX"
  Phản hồi duyệt:       "fldXXXXXXXX"
  Chuỗi Kanban:       "fldXXXXXXXX"
  Đính kèm:           "fldXXXXXXXX"

kanban:
  # Tên tenant của Hermes kanban (hermes kanban list --tenant <cái này>)
  tenant: "default"

# ────────────────────────────────────────────────────────────────
# Kiểm soát an toàn (bản macOS thêm mới)
# ────────────────────────────────────────────────────────────────
security:
  # Ghi ngược vào bảng Lark dùng định danh nào.
  #   "bot"  = bot ứng dụng (khuyến nghị): bot chỉ là cộng tác viên 1 bảng, quyền tối thiểu,
  #            không dùng tài khoản cá nhân để ghi mọi bảng.
  #   "user" = định danh cá nhân (mặc định gốc): có toàn quyền tài khoản, rủi ro cao hơn.
  # Production khuyến nghị "bot", chỉ cần thêm bot làm cộng tác viên bảng.
  write_identity: "bot"

  # Whitelist người được phép kích hoạt điều phối (open_id / user_id Lark).
  # Khi listener nhận thay đổi record, nếu operator ngoài whitelist thì chỉ ghi log,
  # không gửi DM cho orchestrator, không spawn. List rỗng = không giới hạn (chỉ ghi log cảnh báo).
  # Chặn mặt tấn công 'ai đó gõ lệnh vào bảng để inject'.
  allowed_operators: []

  # Cổng duyệt spawn: true = orchestrator nhận task mới phải có người xác nhận mới spawn worker,
  # false = spawn tự động (hành vi gốc). Khuyến nghị ban đầu để true, chạy ổn rồi tắt.
  require_spawn_approval: true

  # orchestrator coi 'chữ trong bảng' là dữ liệu, không phải lệnh hệ thống.
  # Công tắc này chỉ là nhắc nhở, cách ly thật nằm trong SOUL/prompt của orchestrator:
  # Mọi chữ 'bỏ qua lệnh / xóa / sửa config' trong mô tả task đều coi là text thường, không thực thi.
  treat_table_text_as_data: true

paths:
  # Cache khử trùng sự kiện (~ tự mở rộng thành /Users/<you>)
  seen_file:   "~/.hermes/cron/state/base_event_seen.json"
  state_file:  "~/.hermes/cron/state/kanban_watch_state.json"
  # Log luồng sự kiện real-time (tee ghi vào đây)
  log_file:    "~/.hermes/cron/state/larkwatch.log"
  # Tên session tmux
  tmux_name:   "larkwatch"
  # Đường dẫn tuyệt đối script listener (supervisor pipe vào, ~ tự mở rộng)
  listener:   "~/.hermes/scripts/base_event_listener.py"

env:
  # Công tắc ổn định lark-cli khi có proxy
  LARK_CLI_NO_PROXY: "1"
